<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Bir siparişin yolculuğu: garson, mutfak, kasa, gün sonu">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5fc4cc"/></marker></defs>
  <rect width="1000" height="300" rx="18" fill="#0d1330"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="500" y="42" font-size="22" font-weight="700" fill="#ffffff">Bir siparişin yolculuğu</text>
    <g stroke="#5fc4cc" stroke-width="2" fill="none" marker-end="url(#a)">
      <path d="M212 160H262"/><path d="M462 160H512"/><path d="M712 160H762"/>
    </g>
    <g stroke-width="1.5">
      <rect x="32" y="90" width="180" height="140" rx="14" fill="#161d3d" stroke="#334079"/>
      <rect x="262" y="90" width="200" height="140" rx="14" fill="#161d3d" stroke="#334079"/>
      <rect x="512" y="90" width="200" height="140" rx="14" fill="#4f46e5" fill-opacity="0.25" stroke="#7c6cf0"/>
      <rect x="762" y="90" width="206" height="140" rx="14" fill="#059669" fill-opacity="0.22" stroke="#34d399"/>
    </g>
    <g font-size="30"><text x="122" y="132">📱</text><text x="362" y="132">👨‍🍳</text><text x="612" y="132">💳</text><text x="865" y="132">📊</text></g>
    <g font-size="18" font-weight="700" fill="#ffffff"><text x="122" y="166">1. Garson</text><text x="362" y="166">2. Mutfak</text><text x="612" y="166">3. Kasa</text><text x="865" y="166">4. Gün sonu</text></g>
    <g font-size="13" fill="#b8c4ec">
      <text x="122" y="192">Siparişi masadan</text><text x="122" y="210">alır, not ekler</text>
      <text x="362" y="192">Anında düşer, hazır</text><text x="362" y="210">olunca garsona haber</text>
      <text x="612" y="192">Parçalı ödeme,</text><text x="612" y="210">fiş, tip box</text>
      <text x="865" y="192">Z raporu, rapor,</text><text x="865" y="210">otomatik yedek</text>
    </g>
    <text x="500" y="268" font-size="13" fill="#8fa0d6">Mutfağa iletilmemiş ürün varken ödeme alınmaz; böylece sipariş mutfakta unutulmaz.</text>
  </g>
</svg>
