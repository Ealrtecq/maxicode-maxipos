<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" width="1000" height="290" role="img" aria-label="Kurulum 4 adımda tamamlanır">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5fc4cc"/></marker></defs>
  <rect width="1000" height="290" rx="18" fill="#0d1330"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="500" y="42" font-size="22" font-weight="700" fill="#ffffff">Dükkânda kurulum 4 adım</text>
    <g stroke="#5fc4cc" stroke-width="2" fill="none" marker-end="url(#a)">
      <path d="M232 156H262"/><path d="M482 156H512"/><path d="M732 156H762"/>
    </g>
    <g stroke-width="1.5" fill="#161d3d" stroke="#334079">
      <rect x="32" y="84" width="200" height="144" rx="14"/><rect x="262" y="84" width="220" height="144" rx="14"/><rect x="512" y="84" width="220" height="144" rx="14"/>
      <rect x="762" y="84" width="206" height="144" rx="14" fill="#059669" fill-opacity="0.22" stroke="#34d399"/>
    </g>
    <g font-size="26" font-weight="800" fill="#5fc4cc"><text x="132" y="120">1</text><text x="372" y="120">2</text><text x="622" y="120">3</text><text x="865" y="120" fill="#34d399">4</text></g>
    <g font-size="17" font-weight="700" fill="#ffffff"><text x="132" y="154">USB'yi tak</text><text x="372" y="154">Tek komut</text><text x="622" y="154">Sertifikayı yükle</text><text x="865" y="154">Hazır</text></g>
    <g font-size="13" fill="#b8c4ec">
      <text x="132" y="180">Cihazı internete bağla,</text><text x="132" y="198">kurulum belleğini tak</text>
      <text x="372" y="180" font-family="Consolas, monospace" fill="#f0cf65">sudo bash kur.sh</text><text x="372" y="198">veritabanı, servis, yedek</text><text x="372" y="214">kendiliğinden kurulur</text>
      <text x="622" y="180">Telefon ve tabletlere</text><text x="622" y="198">yerel sertifika bir kez</text><text x="622" y="214">yüklenir</text>
      <text x="865" y="180">maxipos.local adresini aç,</text><text x="865" y="198">ana ekrana ekle.</text><text x="865" y="214">İnternet gerekmez.</text>
    </g>
    <text x="500" y="262" font-size="13" fill="#8fa0d6">Sonraki çalıştırmalarda veri korunur, yalnızca uygulama güncellenir; açılmazsa önceki sürüme dönülür.</text>
  </g>
</svg>
